{% extends 'core/base.html' %}
{% block content %}
<div class="card card-h col-md-6"><div class="card-body">
<h4>{% if editing %}Edit{% else %}Add{% endif %} User</h4>
<form method="post">{% csrf_token %}
{% for f in form %}<div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}
{% if f.help_text %}<div class="form-text">{{ f.help_text }}</div>{% endif %}
{% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}
<button class="btn btn-brand">Save</button> <a class="btn btn-outline-dark" href="{% url 'users' %}">Cancel</a></form></div></div>
{% endblock %}
